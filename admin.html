<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - Instagram Online Giveaway</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(225, 48, 108, 0.08), transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(131, 58, 180, 0.08), transparent 50%),
        var(--bg-primary);
      padding: 40px 20px;
    }

    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .admin-login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient);
    }

    .admin-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .admin-logo svg {
      margin-bottom: 12px;
    }

    .admin-logo h2 {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .admin-logo p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .admin-form .form-group label {
      color: var(--text-secondary);
    }

    .admin-error {
      display: none;
      padding: 12px 16px;
      background: rgba(225, 48, 108, 0.12);
      border: 1px solid rgba(225, 48, 108, 0.3);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      color: var(--ig-red);
      text-align: center;
    }

    .admin-error.visible {
      display: block;
      animation: popIn 0.4s ease;
    }

    .admin-back {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .admin-back a {
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .admin-back a:hover {
      color: var(--ig-orange);
    }
  </style>
</head>
<body>
  <div class="admin-login-card">
    <div class="admin-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="admin-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFDC80"/>
            <stop offset="25%" stop-color="#F77737"/>
            <stop offset="50%" stop-color="#E1306C"/>
            <stop offset="75%" stop-color="#C13584"/>
            <stop offset="100%" stop-color="#833AB4"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="url(#admin-grad)" stroke-width="2"/>
        <circle cx="12" cy="12" r="5" stroke="url(#admin-grad)" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="url(#admin-grad)"/>
      </svg>
      <h2 data-i18n="admin_portal">Admin Portal</h2>
      <p data-i18n="admin_subtitle">Sign in to access the dashboard</p>
    </div>
    <form class="admin-form" id="adminLoginForm">
      <div class="admin-error" id="adminError" data-i18n="admin_invalid">Invalid username or password</div>
      <div class="form-group">
        <label for="adminUser" data-i18n="admin_username">Username</label>
        <input type="text" id="adminUser" data-i18n-placeholder="admin_username_ph" placeholder="Enter username" required />
      </div>
      <div class="form-group">
        <label for="adminPass" data-i18n="admin_password">Password</label>
        <input type="password" id="adminPass" data-i18n-placeholder="admin_password_ph" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <span data-i18n="admin_signin">Sign In</span>
      </button>
    </form>
    <div class="admin-back">
      <a href="index.html" data-i18n="admin_back">&larr; Back to Giveaway Site</a>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="i18n.js"></script>
  <script>
    const ADMIN_USER = 'admin@instagiveaway.com';
    const ADMIN_PASS = 'Admin@123';

    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errorEl = document.getElementById('adminError');

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('adminAuth', 'true');
        window.location.href = 'admin-dashboard.html';
      } else {
        errorEl.classList.add('visible');
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPass').focus();
      }
    });
  </script>
</body>
</html>
