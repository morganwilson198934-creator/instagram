<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#feda75"/>
      <stop offset="25%" stop-color="#fa7e1e"/>
      <stop offset="50%" stop-color="#d62976"/>
      <stop offset="75%" stop-color="#962fbf"/>
      <stop offset="100%" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="card-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="28" y="52" width="144" height="96" rx="10" fill="url(#card-bg)"/>
  <!-- Card shine overlay -->
  <rect x="28" y="52" width="144" height="96" rx="10" fill="url(#card-shine)"/>
  <!-- Magnetic strip -->
  <rect x="28" y="70" width="144" height="16" fill="#000" opacity="0.2"/>
  <!-- Card number dots -->
  <circle cx="48" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="56" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="64" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="72" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="92" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="100" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="108" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="116" cy="106" r="2.5" fill="#fff" opacity="0.8"/>
  <text x="140" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">$100</text>
  <!-- Gift text -->
  <text x="100" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#fff" letter-spacing="2" opacity="0.9">GIFT CARD</text>
</svg>
