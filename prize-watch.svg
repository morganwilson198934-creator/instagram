<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="watch-body" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8e8ed"/>
      <stop offset="100%" stop-color="#c8c8cd"/>
    </linearGradient>
    <linearGradient id="watch-screen" x1="100" y1="55" x2="100" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="watch-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#feda75"/>
      <stop offset="50%" stop-color="#d62976"/>
      <stop offset="100%" stop-color="#4f5bd5"/>
    </linearGradient>
  </defs>
  <!-- Band top -->
  <rect x="72" y="8" width="56" height="45" rx="8" fill="#2c2c2e"/>
  <!-- Band bottom -->
  <rect x="72" y="147" width="56" height="45" rx="8" fill="#2c2c2e"/>
  <!-- Watch body -->
  <rect x="60" y="42" width="80" height="116" rx="20" fill="url(#watch-body)" stroke="#aaa" stroke-width="1"/>
  <!-- Screen -->
  <rect x="66" y="50" width="68" height="100" rx="14" fill="url(#watch-screen)"/>
  <!-- Digital Crown -->
  <rect x="140" y="72" width="6" height="14" rx="3" fill="#d1d1d6"/>
  <!-- Side button -->
  <rect x="140" y="94" width="5" height="10" rx="2.5" fill="#d1d1d6"/>
  <!-- Watch face content -->
  <text x="100" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">10:30</text>
  <text x="100" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#fff" opacity="0.6">MONDAY</text>
  <!-- Activity rings -->
  <circle cx="85" cy="115" r="8" stroke="#ff3b30" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="85" cy="115" r="5.5" stroke="#30d158" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="85" cy="115" r="3" stroke="#007aff" stroke-width="2.5" fill="none" opacity="0.8"/>
  <!-- Gradient accent line -->
  <rect x="100" y="112" width="28" height="2" rx="1" fill="url(#watch-accent)" opacity="0.7"/>
</svg>
