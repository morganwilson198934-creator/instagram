<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="box-body" x1="100" y1="30" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8e8ed"/>
      <stop offset="100%" stop-color="#c8c8cd"/>
    </linearGradient>
    <linearGradient id="box-lid" x1="100" y1="30" x2="100" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#d2d2d7"/>
    </linearGradient>
    <linearGradient id="box-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feda75"/>
      <stop offset="25%" stop-color="#fa7e1e"/>
      <stop offset="50%" stop-color="#d62976"/>
      <stop offset="75%" stop-color="#962fbf"/>
      <stop offset="100%" stop-color="#4f5bd5"/>
    </linearGradient>
  </defs>
  <!-- Box body -->
  <rect x="42" y="70" width="116" height="100" rx="6" fill="url(#box-body)" stroke="#b0b0b5" stroke-width="1"/>
  <!-- Box lid -->
  <rect x="36" y="52" width="128" height="24" rx="5" fill="url(#box-lid)" stroke="#b0b0b5" stroke-width="1"/>
  <!-- Ribbon vertical -->
  <rect x="92" y="52" width="16" height="118" fill="url(#box-accent)" opacity="0.85"/>
  <!-- Ribbon horizontal -->
  <rect x="36" y="60" width="128" height="12" fill="url(#box-accent)" opacity="0.85"/>
  <!-- Bow center -->
  <ellipse cx="100" cy="56" rx="10" ry="7" fill="url(#box-accent)"/>
  <!-- Bow loops -->
  <ellipse cx="86" cy="50" rx="12" ry="8" fill="url(#box-accent)" opacity="0.8" transform="rotate(-15 86 50)"/>
  <ellipse cx="114" cy="50" rx="12" ry="8" fill="url(#box-accent)" opacity="0.8" transform="rotate(15 114 50)"/>
  <!-- Box shadow -->
  <ellipse cx="100" cy="175" rx="55" ry="5" fill="#000" opacity="0.08"/>
</svg>
